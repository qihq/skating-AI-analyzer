server {
    listen 80;
    client_max_body_size 2g;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json;

    # The annotation instance only exposes authentication and Golden V2 APIs.
    location /api/auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/golden/v2/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /api/capabilities { proxy_pass http://backend:8000; }
    location = /api/capabilities/advanced { proxy_pass http://backend:8000; }
    location = /api/health { proxy_pass http://backend:8000; }
    location /api/ { return 404; }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
