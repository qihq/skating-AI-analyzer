services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: skating-v2-annotation-backend
    environment:
      SKATING_ANALYSIS_PIPELINE: shadow
      V2_RUNTIME_ROOT: /runtime
      DATA_DIR: /runtime/data
      DATABASE_URL: sqlite+aiosqlite:////runtime/database/skating-analyzer-v2-annotation.db
      BACKUPS_DIR: /runtime/backups
      UPLOADS_DIR: /runtime/uploads
      ARCHIVE_DIR: /runtime/data/archive
      VIDEO_PROCESSING_ROOT: /runtime/temp-frames/processing
      V2_UPLOADS_DIR: /runtime/uploads
      V2_ANALYSIS_ARTIFACTS_DIR: /runtime/analysis-assets
      V2_GOLDEN_DIR: /runtime/golden
      V2_CACHE_DIR: /runtime/cache
      V2_TEMP_FRAMES_DIR: /runtime/temp-frames
      V2_MODEL_OUTPUTS_DIR: /runtime/model-outputs
      V2_TEST_DATA_DIR: /runtime/test-data
      SYNC_SKATER_PROGRESS_ON_STARTUP: "0"
    volumes:
      - /volume1/docker/skating-analyzer-v2-runtime:/runtime
    networks:
      - annotation-private
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: docker/nas-annotation/frontend.Dockerfile
    container_name: skating-v2-annotation-frontend
    ports:
      - "27831:80"
    depends_on:
      - backend
    networks:
      - annotation-private
    restart: unless-stopped

networks:
  annotation-private:
    name: skating-v2-annotation-private
